spring.application.name=community
# MySQL Datasource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_URL:localhost}:3306/community?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret= your-super-secret-key-that-is-at-least-32-bytes-long
jwt.expiration= 3600000 

file.path=${FILE_PATH:C:/Users/admin/Documents/uploads/}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api/docs